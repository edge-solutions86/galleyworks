plugins {
	id 'java'
	id 'jacoco'
	id 'com.diffplug.spotless'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = rootProject.group
version = rootProject.version
description = 'The lexdrift HTTP service: a read-only Spring Web API over an index'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation project(':')
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

	testImplementation testFixtures(project(':'))
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	// Exceptions here are never serialized, so serial lint is noise; annotation processors on
	// the classpath warn about annotations nobody claims.
	options.compilerArgs.addAll([
		'-Xlint:all,-serial,-processing',
		'-Werror'
	])
}

springBoot {
	// The jar runs the command line; only `lexdrift serve` starts Spring.
	mainClass = 'io.github.rkaushikdev.galleyworks.cli.Main'
}

tasks.named('bootJar') {
	archiveBaseName = 'lexdrift-service'
}

tasks.named('test', Test) {
	useJUnitPlatform()
	maxParallelForks = 1
	// The WebMvc slices load Mockito, whose agent appends to the boot class path; without
	// class-data sharing the JVM has nothing to warn about.
	jvmArgs '-Xshare:off'
	testLogging {
		events 'failed'
		exceptionFormat = 'full'
	}
	finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
	toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport', JacocoReport) {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
	dependsOn tasks.named('test')
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.80
			}
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('jacocoTestCoverageVerification')
}

spotless {
	java {
		target 'src/**/*.java'
		palantirJavaFormat()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
	groovyGradle {
		target '*.gradle'
		greclipse()
	}
}
