[build-system]
requires = ["setuptools>=75.6", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexdrift"
version = "0.1.0"
description = "Passage-reuse and near-duplicate detection for legislative instruments"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "rkaushik-dev", email = "anitalune373@gmail.com" }]
dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6.0.1,<7",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.34,<0.35",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lexdrift = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["lexdrift"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"
